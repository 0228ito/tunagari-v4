  <style>
    /* ============================================================
       🎨 デザイントークン（色はRGB値。Tailwindの透明度指定 bg-brand/20 などが効く）
       ライト基本。端末がダークなら自動でダーク。手動切替は <html data-theme="light|dark">
       ============================================================ */
    :root {
      color-scheme: light;
      --bg: 245 250 248;
      --surface: 255 255 255;
      --sunk: 235 243 240;
      --line: 220 232 228;
      --ink: 31 42 39;
      --sub: 84 101 95;
      --mute: 92 107 101;
      --brand: 53 181 151;
      --brand-deep: 25 116 96;
      --brand-tint: 230 246 241;
      --on-brand: 10 49 40;
      --ask: 255 190 72;
      --ask-tint: 255 244 219;
      --ask-ink: 122 72 0;
      --love: 255 94 130;
      --love-tint: 255 232 238;
      --love-ink: 197 34 77;
      --danger: 214 69 80;
      --danger-tint: 253 235 237;
      --danger-ink: 176 38 52;
      --sky: 90 160 240;
      --sky-tint: 232 242 255;
      --sky-ink: 30 90 170;
      --shadow-soft: 0 1px 2px rgb(20 60 50 / .06), 0 12px 28px -16px rgb(25 116 96 / .32);
      --shadow-lift: 0 2px 4px rgb(20 60 50 / .08), 0 18px 36px -16px rgb(25 116 96 / .42);
      --blob-a: 53 181 151 / .22;
      --blob-b: 255 190 72 / .20;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: 14 22 20; --surface: 22 33 30; --sunk: 31 45 41; --line: 43 60 55;
        --ink: 233 242 239; --sub: 168 187 180; --mute: 132 152 145;
        --brand: 74 204 171; --brand-deep: 112 224 196; --brand-tint: 24 58 50; --on-brand: 6 38 31;
        --ask: 255 200 90; --ask-tint: 58 45 18; --ask-ink: 255 214 130;
        --love: 255 110 142; --love-tint: 62 28 38; --love-ink: 255 156 178;
        --danger: 255 120 130; --danger-tint: 62 28 32; --danger-ink: 255 168 174;
        --sky: 120 180 250; --sky-tint: 26 44 70; --sky-ink: 160 205 255;
        --shadow-soft: 0 1px 0 rgb(255 255 255 / .04) inset, 0 14px 28px -16px rgb(0 0 0 / .7);
        --shadow-lift: 0 1px 0 rgb(255 255 255 / .05) inset, 0 20px 36px -16px rgb(0 0 0 / .8);
        --blob-a: 74 204 171 / .14;
        --blob-b: 255 200 90 / .08;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: 14 22 20; --surface: 22 33 30; --sunk: 31 45 41; --line: 43 60 55;
      --ink: 233 242 239; --sub: 168 187 180; --mute: 132 152 145;
      --brand: 74 204 171; --brand-deep: 112 224 196; --brand-tint: 24 58 50; --on-brand: 6 38 31;
      --ask: 255 200 90; --ask-tint: 58 45 18; --ask-ink: 255 214 130;
      --love: 255 110 142; --love-tint: 62 28 38; --love-ink: 255 156 178;
      --danger: 255 120 130; --danger-tint: 62 28 32; --danger-ink: 255 168 174;
      --sky: 120 180 250; --sky-tint: 26 44 70; --sky-ink: 160 205 255;
      --shadow-soft: 0 1px 0 rgb(255 255 255 / .04) inset, 0 14px 28px -16px rgb(0 0 0 / .7);
      --shadow-lift: 0 1px 0 rgb(255 255 255 / .05) inset, 0 20px 36px -16px rgb(0 0 0 / .8);
      --blob-a: 74 204 171 / .14;
      --blob-b: 255 200 90 / .08;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { background: rgb(var(--bg)); }
    body {
      font-family: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: rgb(var(--bg));
      color: rgb(var(--ink));

      margin: 0;
      padding: 0;
    }
    button { font-family: inherit; }
    button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, label:focus-visible {
      outline: 3px solid rgb(var(--brand) / .55);
      outline-offset: 2px;
    }

    .scrollbar-none { -ms-overflow-style: none; scrollbar-width: none; }

    /* アイコン（Material Symbols Rounded） */
    .ms {
      font-family: 'Material Symbols Rounded';
      font-weight: normal; font-style: normal; font-size: 20px; line-height: 1;
      letter-spacing: normal; text-transform: none; display: inline-block; white-space: nowrap;
      -webkit-font-feature-settings: 'liga'; font-feature-settings: 'liga';
      -webkit-font-smoothing: antialiased; user-select: none; flex-shrink: 0;
      font-variation-settings: 'FILL' 0, 'wght' 500, 'GRAD' 0, 'opsz' 24;
    }
    .ms.fill { font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24; }

    /* 背景のやわらかい色のにじみ（装飾） */
    .bg-blobs {
      background:
        radial-gradient(60% 40% at 0% 0%, rgb(var(--blob-a)) 0%, transparent 70%),
        radial-gradient(50% 35% at 100% 8%, rgb(var(--blob-b)) 0%, transparent 70%);
    }

    /* ガラス表現はナビとトーストの1層だけ（本文は常に不透明の面に置く） */
    .glass { background: rgb(var(--surface) / .94); border: 1px solid rgb(var(--line) / .8); }
    @supports ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
      @media (prefers-reduced-transparency: no-preference) {
        .glass { background: rgb(var(--surface) / .72); -webkit-backdrop-filter: blur(18px) saturate(1.5); backdrop-filter: blur(18px) saturate(1.5); }
      }
    }

    /* 動き：ばねのような軽い弾み。動きを減らす設定の端末では止める */
    .press { transition: transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .2s, background-color .2s; }
    .press:active { transform: scale(.96); }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(.8); opacity: 1; }
      50% { opacity: 1; }
      100% { transform: translateY(-64px) scale(1.4); opacity: 0; }
    }
    .animate-float-heart { animation: floatUp .85s cubic-bezier(.25,.46,.45,.94) forwards; }
    @keyframes springBounce {
      0% { transform: scale(1); } 35% { transform: scale(1.2); } 65% { transform: scale(.94); } 100% { transform: scale(1); }
    }
    .animate-bounce-click { animation: springBounce .38s cubic-bezier(.175,.885,.32,1.275); }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .animate-slide-up { animation: slideUp .32s cubic-bezier(.22,1,.36,1); }
    /* 横に続きがある列の右端をぼかして、スクロールできることを示す */
    .fade-r { -webkit-mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to right, #000 calc(100% - 32px), transparent); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-up { animation: fadeUp .4s cubic-bezier(.22,1,.36,1) both; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .animate-fade-in { animation: fadeIn .25s ease-out both; }
    @keyframes popIn { 0% { opacity: 0; transform: translate(-50%, -8px) scale(.94); } 100% { opacity: 1; transform: translate(-50%, 0) scale(1); } }
    .animate-pop { animation: popIn .28s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
    .shimmer-bg { background: linear-gradient(90deg, transparent 0%, rgb(255 255 255 / .35) 50%, transparent 100%); background-size: 200% 100%; animation: shimmer 3s infinite; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
  </style>

<body class="bg-bg text-ink min-h-screen overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // ============================================================
    // 🏫 大学設定（ここ1か所を変えると、全画面の大学名・学部名・サンプルデータが切り替わります）
    //   ・通常は下の ACTIVE_UNIVERSITY を書き換えてください
    //   ・URL末尾に ?univ=otaru を付けて開くと、ファイルを書き換えずに切り替えて確認できます
    //   ・新しい大学を足すときは UNIVERSITIES に1ブロック追加するだけです
    // ============================================================
    const ACTIVE_UNIVERSITY = "hokudai";

    const UNIVERSITIES = {
      hokudai: {
        name: "北海道大学",          // 正式名称
        short: "北大",               // 略称（「北大生」「北大認証済」などに使用）
        faculty: "経済学部",         // マイページ表示用の学部名
        facultyShort: "経済",        // 投稿者表示用（例：経済3年）
        facultyBuilding: "経済学部2号館",
        building: "理学部2号館",     // 休講掲示板のサンプル用
        dining: "北部食堂",          // 学食のサンプル用
        peerA: "総合理系", peerB: "物理", peerC: "文学部"  // 他学部の学生のサンプル表示用
      },
      otaru: {
        name: "小樽商科大学",
        short: "小樽商大",
        faculty: "商学部",
        facultyShort: "商",
        facultyBuilding: "講義棟",
        building: "講義棟",
        dining: "学食",
        peerA: "商", peerB: "商", peerC: "商"
      }
    };

    const _univParam = new URLSearchParams(window.location.search).get("univ");
    const UNIV_ID = (_univParam && UNIVERSITIES[_univParam]) ? _univParam : ACTIVE_UNIVERSITY;
    const U = UNIVERSITIES[UNIV_ID];
    document.title = `キャンパスリアルポータル｜${U.name}`;

    // ============================================================
    // 💾 保存（この端末のブラウザに保存。リロードしても質問・回答・ポイントが残ります）
    //   ※ 保存先は端末ごとです。他の学生の端末とは共有されません（共有にはサーバーが必要）
    // ============================================================
    const STORAGE_PREFIX = `tunagari-proto-261013ai:${UNIV_ID}:`;

    function usePersistentState(key, initialFactory) {
      const [value, setValue] = useState(() => {
        try {
          const raw = window.localStorage.getItem(STORAGE_PREFIX + key);
          if (raw !== null) return JSON.parse(raw);
        } catch (e) { /* 保存できない環境では初期値で動く */ }
        return initialFactory();
      });
      useEffect(() => {
        try { window.localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value)); } catch (e) { /* 容量超過など */ }
      }, [key, value]);
      return [value, setValue];
    }

    function clearAllPersisted() {
      try {
        Object.keys(window.localStorage)
          .filter(k => k.startsWith("tunagari-proto-261013ai:"))
          .forEach(k => window.localStorage.removeItem(k));
      } catch (e) {}
    }

    // 画像は縮小して保存（localStorageの容量を守るため）
    function readAndDownscale(file, maxSide, done) {
      const reader = new FileReader();
      reader.onerror = () => done(null);
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          try {
            const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
            const c = document.createElement("canvas");
            c.width = Math.max(1, Math.round(img.width * scale));
            c.height = Math.max(1, Math.round(img.height * scale));
            c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
            done(c.toDataURL("image/jpeg", 0.72));
          } catch (e) { done(reader.result); }
        };
        img.onerror = () => done(reader.result);
        img.src = reader.result;
      };
      reader.readAsDataURL(file);
    }

    const IS_STANDALONE = (() => {
      try {
        return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
      } catch (e) { return false; }
    })();

    // ============================================================
    // 🗂 カテゴリ（授業を核に、暮らし・新歓まで）
    // ============================================================
    const CATEGORIES = [
      "授業・過去問",
      "休講・掲示板",
      "グルメ・学食",
      "作業スペース",
      "暮らし・家探し",
      "体調・健康",
      "新歓・サークル",
      "バイト・研究室"
    ];

    const REPORT_REASONS = [
      "誹謗中傷・個人や団体が特定できる内容",
      "虚偽・誤った情報",
      "広告・宣伝・勧誘",
      "その他"
    ];

    // ============================================================
    // 🤖 回答がつかない質問へのAI仮回答／回答が多い質問の「まとめ」
    //   ※ このデモでは文章を端末内のルールで作っています（外部のAIは呼びません）。
    //     本番では、サーバー側でAI（LLM）に生成させる想定です。
    // ============================================================
    const AI_FIRST_ANSWER_DELAY_MS = 4000;   // 学生の回答が付かないまま、この時間が過ぎたらAIが仮回答（本番は30分〜1時間を想定）
    const SUMMARY_MIN_ANSWERS = 10;          // 回答がこの件数以上になったら「みんなの回答まとめ」を表示

    // AIサポーターの文面（機械的にならないよう、やさしい話し言葉で。カテゴリごとに、気持ちに寄り添う一言＋参考になりそうなこと）
    const AI_INTROS = {
      "授業・過去問": "授業のことって、身近に聞ける人がいないと不安になりますよね。",
      "休講・掲示板": "予定が変わるかもしれないとき、気になってしまいますよね。",
      "グルメ・学食": "毎日のごはん選び、地味に大事ですよね。",
      "作業スペース": "集中できる場所が見つかると、毎日がぐっとラクになりますよね。",
      "暮らし・家探し": "新しい暮らしを考えるのは、わくわくする反面、不安も大きいですよね。",
      "体調・健康": "体調のことは、ひとりで抱えると心細くなりますよね。",
      "新歓・サークル": "どこに入るか迷う時期は、ほんとうに悩みますよね。",
      "バイト・研究室": "働き方や進路のことは、迷って当たり前だと思います。"
    };
    const AI_TIPS = {
      "授業・過去問": ["まずはシラバスを開いて、成績の付け方（試験・レポート・出席）を見てみると、全体像がつかみやすいですよ。", "履修や試験のルールは、学務の案内にいちばん正確なことが載っています。迷ったら窓口で聞いても大丈夫です。", "同じ授業を取っている友達や先輩に、気軽に一言聞いてみるのもおすすめです。"],
      "休講・掲示板": ["公式のポータルや掲示板に、最新の情報が出ていないか見てみてくださいね。", "授業の連絡は、メールや学習支援システムに届いていることもあります。", "もし掲示を見つけたら、写真つきで投稿してもらえると、同じように探している人がきっと助かります。"],
      "グルメ・学食": ["営業時間や混みやすい時間は、公式の案内でチェックしてみてください。", "ピークを少しずらすだけで、ゆっくり座れることが多いですよ。", "気になるメニューは、写真を添えて聞いてみると、答えてもらいやすいです。"],
      "作業スペース": ["図書館や自習スペースの利用時間・ルールを、先にのぞいておくと安心です。", "「コンセントがほしい」「静かなところがいい」など、条件を書き足してくれると、みんなが答えやすくなります。", "朝や夕方など、空いていそうな時間帯も試してみてくださいね。"],
      "暮らし・家探し": ["通学時間と手段（徒歩・自転車・公共交通）を並べて比べてみると、暮らしのイメージがつかみやすいです。", "時間があれば、昼と夜の両方で現地を歩いてみてください。雰囲気は意外と違います。", "家賃のほかに、初期費用や光熱費も見ておくと安心です。生協や学生支援の窓口で相談できる場合もあります。"],
      "体調・健康": ["つらいときは、無理せず休んでください。大学の保健管理施設や医療機関に相談してみましょう。", "症状が重かったり、長引いたりするときは、早めに受診してくださいね。", "私はAIなので、診断はできません。体のことは、専門の方を頼ってください。"],
      "新歓・サークル": ["体験や見学に行って、活動の頻度・費用・雰囲気を自分の目で確かめてみてください。", "気になる団体の説明会や公式の発信は、いくつか見比べると安心です。", "入る前に、1年間でかかる費用と活動日を、先輩にこっそり聞いておくのもおすすめです。"],
      "バイト・研究室": ["求人票や募集要項で、時給・シフト・勤務地をじっくり見比べてみてください。", "研究室は、見学や先輩への相談で、雰囲気や指導の様子がつかめます。", "学内のキャリア・就職の窓口で相談できる場合もあるので、頼ってみてくださいね。"]
    };

    function makeAiAnswer(category, title) {
      return {
        label: "AIサポーターより",
        intro: `質問してくれてありがとうございます。${AI_INTROS[category] || AI_INTROS["授業・過去問"]}まだ回答が届いていないので、先に私から、参考になりそうなことをお伝えしますね。`,
        tips: AI_TIPS[category] || AI_TIPS["授業・過去問"],
        outro: "回答が届くまで、少しだけ待っていてくださいね。同じことで迷った先輩が、きっと答えてくれます。状況を書き足してもらえると、みんなが答えやすくなります。",
        createdAt: Date.now()
      };
    }

    // ---- 回答のまとめ（デモ用：キーワードの集計から作ります）----
    const SUMMARY_KEYWORDS = [
      { label: "シラバスを確認する", re: /シラバス/ },

    // ボトムシート（外側タップで閉じる）
    function Sheet({ onClose, z = 50, children, tone }) {
      // 上のつまみ（バー）を下に引くと閉じる。一定以上引くか、勢いよく離すと閉じ、足りなければ元の位置に戻る
      const [dy, setDy] = useState(0);
      const [dragging, setDragging] = useState(false);
      const drag = useRef({ y: null, t: 0, v: 0, last: 0 });
      const onDown = (e) => {
        if (e.preventDefault) e.preventDefault();
        drag.current = { y: e.clientY, t: Date.now(), v: 0, last: e.clientY };
        setDragging(true);
        if (e.currentTarget.setPointerCapture) { try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {} }
      };
      const onMove = (e) => {
        if (drag.current.y == null) return;
        const now = Date.now();
        const dt = Math.max(1, now - drag.current.t);
        drag.current.v = (e.clientY - drag.current.last) / dt;
        drag.current.last = e.clientY; drag.current.t = now;
        setDy(Math.max(0, e.clientY - drag.current.y));
      };
      const onUp = () => {
        if (drag.current.y == null) return;
        const fast = drag.current.v > 0.6;
        drag.current.y = null;
        setDragging(false);
        if (dy > 110 || (fast && dy > 30)) onClose(); else setDy(0);
      };
      return (
        <div className={cx("fixed inset-0 flex items-end justify-center animate-fade-in")} style={{ zIndex: z, background: `rgb(10 20 18 / ${Math.max(0.12, 0.5 - dy / 700)})` }} onClick={onClose}>

            className={cx("bg-surface text-ink w-full max-w-md rounded-t-[2rem] max-h-[90vh] flex flex-col overflow-hidden animate-slide-up shadow-lift", tone)}
            style={{ transform: dy ? `translateY(${dy}px)` : undefined, transition: dragging ? "none" : "transform .25s cubic-bezier(.22,1,.36,1)" }}
            onClick={(e) => e.stopPropagation()}
          >
            <div
              className="pt-3 pb-2 flex justify-center cursor-grab touch-none select-none"
              onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp} onPointerCancel={onUp}
              role="presentation"
            >
              <div className="w-10 h-1.5 bg-line rounded-full"></div>
            </div>
            {children}
          </div>
        </div>
      );
    }

    function ScrollRow({ className, children, ...rest }) {
      const ref = useRef(null);

      const check = () => {
        const el = ref.current;
        if (el) setMore(el.scrollWidth - el.clientWidth - el.scrollLeft > 6);
      };
      useEffect(() => {
        check();
        const t = setTimeout(check, 300);
        window.addEventListener("resize", check);
        return () => { clearTimeout(t); window.removeEventListener("resize", check); };
      });
      return <div ref={ref} onScroll={check} className={cx(className, more && "fade-r")} {...rest}>{children}</div>;

        const q = searchQuery.trim();
        if (!q) return null;
        const last = norm((q.match(/(\S*)$/) || ["", ""])[1].replace(/^[#＃]/, ""));
        const hist = searchHistory.filter(h => h !== q && norm(h).includes(norm(q))).slice(0, 3);
        const kw = last ? KEYWORD_POOL.filter(k => norm(k).includes(last) && norm(k) !== last)
          .sort((x, y) => (norm(y).startsWith(last) ? 1 : 0) - (norm(x).startsWith(last) ? 1 : 0)).slice(0, 5) : [];
        const titles = last ? posts.filter(p => !reportedIds.includes(`p:${p.id}`) && norm(p.title).includes(last)).slice(0, 3) : [];
        return { hist, kw, titles };
      }, [searchQuery, searchHistory, posts, reportedIds]);

      const addHistory = (q) => {
        const t = (q || "").trim();
        if (!t) return;
        setSearchHistory(prev => [t, ...prev.filter(x => x !== t)].slice(0, 8));
      };
      // 検索を確定（履歴に残し、候補を閉じる）
      const runSearch = (q) => {
        setSearchQuery(q);
        addHistory(q);
        setIsSearchFocused(false);
        setSelectedPost(null);
      };
      const resetResultFilters = () => {
        setOnlyInfo(false); setAnswerFilter("all"); setFImage(false); setFPopular(false); setFRecent(false); setSortKey("recommended");
      };
      const activeFilterList = [
        onlyQuestions && { key: "q", label: "質問", clear: () => setOnlyQuestions(false) },
        onlyInfo && { key: "i", label: "情報", clear: () => setOnlyInfo(false) },
        answerFilter === "none" && { key: "n", label: "回答なし", clear: () => setAnswerFilter("all") },
        answerFilter === "has" && { key: "h", label: "回答あり", clear: () => setAnswerFilter("all") },
        fImage && { key: "p", label: "写真あり", clear: () => setFImage(false) },
        fPopular && { key: "f", label: "高評価", clear: () => setFPopular(false) },
        fRecent && { key: "r", label: "1週間以内", clear: () => setFRecent(false) }
      ].filter(Boolean);
      const activeFilterCount = activeFilterList.length;

      const activeDirectAnswer = useMemo(() => {
        if (onlyQuestions) return null;
        if (selectedTag) {
          const match = Object.values(DIRECT_ANSWERS).find(a => a.tag === selectedTag);
          if (match) return match;
        }
        if (searchQuery) {
          const key = Object.keys(DIRECT_ANSWERS).find(k => searchQuery.includes(k));
          if (key) return DIRECT_ANSWERS[key];
        }
        return null;
      }, [searchQuery, selectedTag, onlyQuestions]);

      // 🔐 入口画面：未認証のあいだは入口だけを表示（すべてのフック呼び出しより後ろに置くこと）
      if (!verified) {
        return <GateScreen U={U} onEnter={() => setVerified(true)} />;
      }

      const isQuestion = !!selectedPost && selectedPost.type === "question";
      const sortedComments = selectedPost
        ? [...selectedPost.comments].sort((a, b) => (b.thanks || 0) - (a.thanks || 0))
        : [];
      const showInstallBanner = !bannerDismissed && !IS_STANDALONE;
      const hasStudentAnswers = !!selectedPost && selectedPost.comments.length > 0;
      const visibleComments = showAllAnswers ? sortedComments : sortedComments.slice(0, 10);

      return (
        <div className="w-full max-w-md mx-auto min-h-screen bg-bg text-ink flex flex-col relative pb-32 overflow-x-hidden bg-blobs">

          <header className="sticky top-0 z-30 bg-bg/95 px-4 pb-2.5 w-full" style={{ paddingTop: "max(0.75rem, env(safe-area-inset-top))" }}>
            <div className="flex justify-between items-center gap-2">
              <div className="flex items-center gap-2 min-w-0">
                <div className="hidden min-[380px]:flex w-9 h-9 rounded-2xl bg-brand text-on-brand items-center justify-center shadow-soft rotate-[-6deg] flex-shrink-0">
                  <Icon n="diversity_3" fill size={22} />
                </div>
                <div className="min-w-0">
                  <h1 className="font-head font-black text-[13px] leading-tight whitespace-nowrap">キャンパスリアルポータル</h1>
                  <span className="text-[12px] text-sub flex items-center gap-1 truncate">
                    <Icon n="verified" fill size={13} className="text-brand-deep" />{U.short}生限定コミュニティ
                  </span>
                </div>
              </div>

              <div className="flex items-center gap-1.5 flex-shrink-0">
                <button
                  onClick={() => setOpenNotices(true)}
                  aria-label={unreadTotal > 0 ? `お知らせ（未読${unreadTotal}件）` : "お知らせ"}
                  className="relative w-10 h-10 rounded-full bg-surface border border-line/70 shadow-soft flex items-center justify-center press"
                >
                  <Icon n="notifications" fill={unreadTotal > 0} size={22} className={unreadTotal > 0 ? "text-brand-deep" : "text-sub"} />
                  {unreadTotal > 0 && (
                    <span className="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-love text-white text-[10px] font-black flex items-center justify-center">{unreadTotal}</span>
                  )}
                </button>
                <button
                  onClick={() => setOpenPointExchangeModal(true)}
                  className="bg-ask-tint text-ask-ink rounded-full pl-3 pr-2 py-2 flex items-center gap-1 font-black text-[13px] press"

                  <Icon n="stars" fill size={18} />

                  <Icon n="chevron_right" size={18} />
                </button>

            </div>
          </header>

          <main className="flex-1 px-4 pt-2 space-y-4 w-full max-w-full overflow-x-hidden">

            {/* TAB 0: フィード */}

              <div className="space-y-4 w-full">

                {/* 📲 ホーム画面追加の案内（開く手間を減らす） */}
                {showInstallBanner && (
                  <div className="bg-sky-tint rounded-3xl p-3.5 flex gap-3 items-start w-full animate-fade-up">

                    <div className="flex-1 min-w-0 text-[12px] leading-relaxed">

                      <p className="text-sub">iPhone：共有ボタン →「ホーム画面に追加」／Android：メニュー →「ホーム画面に追加」</p>
                    </div>
                    <button onClick={() => setBannerDismissed(true)} aria-label="閉じる" className="text-sub w-8 h-8 flex items-center justify-center flex-shrink-0 press">
                      <Icon n="close" size={18} />
                    </button>
                  </div>
                )}

                {/* 🔍 検索 */}
                <div className="space-y-3 w-full relative">
                  <div className="relative w-full">
                    <Icon n="search" size={22} className="absolute left-4 top-1/2 -translate-y-1/2 text-mute" />
                    <input
                      type="text"
                      placeholder="例：マクロ経済, 過去問, 作業スペース..."
                      value={searchQuery}
                      enterKeyHint="search"
                      onFocus={() => setIsSearchFocused(true)}
                      onChange={(e) => { setSearchQuery(e.target.value); setIsSearchFocused(true); }}
                      onKeyDown={(e) => { if (e.key === "Enter" && !e.nativeEvent.isComposing) { addHistory(searchQuery); setIsSearchFocused(false); e.currentTarget.blur(); } }}

                  </div>

                  {/* 🔎 入力中の候補／（空のとき）検索履歴・トレンド・ハッシュタグ */}

                            {searchHistory.map(h => (

                        </div>

                  {isSearchFocused && searchQuery && suggestions && (

                      </button>
                      {suggestions.hist.map(h => (

                          <Icon n="history" size={18} className="text-mute" /><span className="truncate">{h}</span>

                      {suggestions.kw.map(k => (

                      ))}
                      {suggestions.titles.map(p => (

                        </button>
                      ))}
                      <button onClick={() => setIsSearchFocused(false)} className="w-full text-center py-1.5 text-[12px] text-mute font-bold">候補を閉じる</button>
                    </div>
                  )}

                  {/* クイック検索タグ（質問／カテゴリ） */}
                  <ScrollRow className="flex gap-2 overflow-x-auto pb-1 scrollbar-none w-full -mx-0.5 px-0.5">
                    <button
                      onClick={() => { setOnlyInfo(false); setOnlyQuestions(!onlyQuestions); }}
                      className={cx(
                        "px-3.5 py-2 rounded-full text-[13px] font-black whitespace-nowrap flex items-center gap-1 flex-shrink-0 press",
                        onlyQuestions ? "bg-ask text-on-brand shadow-soft" : "bg-ask-tint text-ask-ink"
                      )}
                    >
                      <Icon n="help" fill size={16} />
                      <span>質問</span>
                    </button>
                    {CATEGORIES.map(cat => (
                      <button
                        key={cat}
                        onClick={() => setSelectedTag(selectedTag === cat ? "" : cat)}
                        className={cx(
                          "px-3.5 py-2 rounded-full text-[13px] font-bold whitespace-nowrap flex-shrink-0 press",
                          selectedTag === cat ? "bg-brand text-on-brand shadow-soft font-black" : "bg-surface text-sub border border-line/70"
                        )}
                      >
                        #{cat}
                      </button>
                    ))}
                    <button
                      onClick={() => setSearchQuery(searchQuery === "楽単" ? "" : "楽単")}
                      className={cx(
                        "px-3.5 py-2 rounded-full text-[13px] font-bold whitespace-nowrap flex-shrink-0 press",
                        searchQuery === "楽単" ? "bg-ask text-on-brand font-black shadow-soft" : "bg-surface text-sub border border-line/70"
                      )}
                    >
                      #楽単・おすすめ
                    </button>
                  </ScrollRow>
                </div>

                {/* 🎯 検索結果 */}
                {isSearching ? (
                  <div className="space-y-4">
                    <div className="space-y-2.5">
                      <div className="flex justify-between items-center px-1">
                        <span className="font-head font-black text-[16px] text-brand-deep flex items-center gap-1.5">
                          <Icon n="manage_search" size={22} />
                          <span>検索結果 ({filteredPosts.length}件)</span>
                        </span>
                        <button
                          onClick={() => { setSearchQuery(""); setSelectedTag(""); setOnlyQuestions(false); resetResultFilters(); }}
                          className="text-sub text-[12px] underline"
                        >
                          検索をクリア
                        </button>
                      </div>

                      <ScrollRow className="flex items-center gap-2 overflow-x-auto scrollbar-none">
                        <button
                          onClick={() => setSearchSheet("sort")}
                          aria-label="並べ替え"
                          className="flex-shrink-0 px-3 py-1.5 rounded-full text-[12px] font-black bg-ink text-bg flex items-center gap-1 press"
                        >
                          <Icon n="swap_vert" size={16} />{(SORT_OPTIONS.find(o => o.v === sortKey) || SORT_OPTIONS[0]).label}<Icon n="expand_more" size={16} />
                        </button>
                        <button
                          onClick={() => setSearchSheet("filter")}
                          aria-label="絞り込み"
                          className={cx(
                            "flex-shrink-0 px-3 py-1.5 rounded-full text-[12px] font-black flex items-center gap-1 press border-[1.5px]",
                            activeFilterCount > 0 ? "bg-brand text-on-brand border-brand" : "bg-surface text-sub border-line"
                          )}
                        >
                          <Icon n="tune" size={16} />絞り込み
                          {activeFilterCount > 0 && <span className="bg-surface text-brand-deep rounded-full text-[12px] min-w-[18px] h-[18px] px-1 flex items-center justify-center">{activeFilterCount}</span>}
                        </button>
                        {activeFilterList.map(f => (
                          <button key={f.key} onClick={f.clear} aria-label={`${f.label}を外す`} className="flex-shrink-0 bg-brand-tint text-brand-deep rounded-full pl-2.5 pr-1.5 py-1.5 text-[12px] font-bold flex items-center gap-0.5 press">
                            {f.label}<Icon n="close" size={14} />
                          </button>
                        ))}
                        {relatedKeywords.length > 0 && <span className="flex-shrink-0 text-[12px] font-bold text-mute pl-1 border-l border-line">関連</span>}
                        {relatedKeywords.map(k => (
                          <button key={k.q} onClick={() => runSearch(k.q)} className="flex-shrink-0 text-[13px] font-bold text-brand-deep press whitespace-nowrap px-0.5">{k.label}</button>
                        ))}
                      </ScrollRow>
                    </div>

                    {/* ⚡ 1秒結論カード（AIダイレクトアンサー） */}
                    {activeDirectAnswer && (
                      <div className="bg-sky-tint rounded-3xl p-4 shadow-soft space-y-2.5 animate-fade-up w-full overflow-hidden relative">
                        <div className="flex justify-between items-center gap-2">
                          <span className="font-head font-black text-[14px] text-sky-ink flex items-center gap-1.5 min-w-0">
                            <Icon n="bolt" fill size={20} className="flex-shrink-0" />
                            <span className="leading-snug">{activeDirectAnswer.title.replace(/^⚡\s*/, "")}</span>
                          </span>
                          <span className="text-[12px] bg-surface text-sky-ink px-2.5 py-0.5 rounded-full font-black flex-shrink-0">1秒結論</span>
                        </div>
                        <p className="text-[14px] text-ink leading-relaxed font-bold bg-surface rounded-2xl p-3.5">
                          {activeDirectAnswer.summary}
                        </p>
                        <div className="flex flex-wrap justify-between items-center gap-x-3 text-[12px] text-sub">
                          <span>以下に信頼度の高い原文ノートを直結表示しています</span>
                          <span className="text-sky-ink font-bold">要点確認完了 ✓</span>
                        </div>
                      </div>
                    )}

                    {filteredPosts.length === 0 ? (
                      <div className="text-center py-10 px-4 bg-surface rounded-3xl shadow-soft border border-line/70 space-y-2.5">
                        <div className="w-14 h-14 rounded-3xl bg-sunk text-mute mx-auto flex items-center justify-center">
                          <Icon n="search_off" size={30} />
                        </div>
                        <p className="font-head font-black text-[16px]">該当する情報が見つかりませんでした</p>
                        <p className="text-[13px] text-sub">条件を変更するか、みんなに質問してみましょう</p>
                        <div className="flex flex-wrap justify-center gap-2 pt-1">
                          {TRENDING_KEYWORDS.slice(0, 4).map(k => (

                          ))}
                        </div>
                        <button
                          onClick={() => openAsk(searchQuery.trim())}
                          className="mt-1 bg-ask text-on-brand font-black text-[14px] px-5 py-3 rounded-2xl shadow-soft inline-flex items-center gap-1.5 press"
                        >
                          <Icon n="help" fill size={20} />

                      setOpenReportModal(false);
                    }}
                    className="w-full bg-surface text-brand-deep font-black py-3.5 rounded-2xl shadow-lift text-[14px] flex items-center justify-center gap-1.5 press"
                  >
                    <Icon n="content_copy" size={20} />
                    <span>SNS用カード画像を保存・シェア</span>
                  </button>
                  <p className="text-[12px] text-white/85 text-center font-medium">
                    ※個人情報は含まれず、学内実績データのみが画像化されます
                  </p>
                </div>
              </div>
            </div>
          )}

          {/* 🤖 AI自己分析モーダル */}
          {openAiAnalysisModal && (
            <Dialog onClose={() => setOpenAiAnalysisModal(false)}>
              <div className="p-5 space-y-4">
                <div className="flex justify-between items-center">
                  <div className="flex items-center gap-2">
                    <div className="w-9 h-9 rounded-2xl bg-sky-tint text-sky-ink flex items-center justify-center">
                      <Icon n="psychology" fill size={22} />
                    </div>
                    <h3 className="font-head font-black text-[16px]">AI活動ログ自己分析レポート</h3>
                  </div>
                  <button onClick={() => setOpenAiAnalysisModal(false)} aria-label="閉じる" className="w-9 h-9 rounded-full bg-sunk text-sub flex items-center justify-center press">
                    <Icon n="close" size={20} />
                  </button>
                </div>

                {isAnalyzing ? (
                  <div className="py-10 text-center space-y-3">
                    <div className="inline-block animate-spin rounded-full h-9 w-9 border-4 border-sky border-t-transparent"></div>
                    <p className="text-[13px] font-bold text-sky-ink animate-pulse">
                      あなたの蓄積ログを読み込んで自己分析を生成中...
                    </p>
                  </div>
                ) : (
                  <div className="space-y-3 text-[13px] leading-relaxed">
                    <div className="bg-sky-tint p-4 rounded-3xl whitespace-pre-wrap text-ink">
                      {aiAnalysisResult}
                    </div>
                    <button
                      onClick={() => setOpenAiAnalysisModal(false)}
                      className="w-full bg-sky-ink text-bg font-black py-3.5 rounded-2xl text-[14px] shadow-soft press"
                    >
                      自分の振り返りを完了する
                    </button>
                  </div>
                )}
              </div>
            </Dialog>
          )}

          {/* 🚩 通報ボトムシート */}
          {reportTarget && (
            <Sheet onClose={() => setReportTarget(null)} z={60}>
              <SheetHeader
                title={reportTarget.commentId ? "このコメントを通報する" : "この投稿を通報する"}
                icon="flag"
                onClose={() => setReportTarget(null)}
              />

              <div className="px-5 pb-4 pt-1 space-y-2.5">
                <p className="text-[13px] text-sub leading-relaxed">理由を選んでください。通報した内容は、あなたの画面ではすぐに非表示になります。</p>
                {REPORT_REASONS.map(reason => (
                  <button
                    key={reason}
                    onClick={() => setReportReason(reason)}
                    className={cx(
                      "w-full text-left px-4 py-3.5 rounded-2xl border-2 text-[14px] font-bold flex items-center gap-2.5 press",
                      reportReason === reason ? "bg-danger-tint border-danger text-danger-ink" : "bg-surface border-line text-ink"
                    )}
                  >
                    <Icon n={reportReason === reason ? "radio_button_checked" : "radio_button_unchecked"} fill={reportReason === reason} size={22} />
                    <span>{reason}</span>
                  </button>
                ))}
                <p className="text-[12px] text-mute">※ デモ版のため、通報内容は運営には送信されません。</p>
              </div>

              <div className="px-4 pt-3 pb-4 border-t border-line flex gap-2.5">
                <button onClick={() => setReportTarget(null)} className={cx(BTN_SOFT, "flex-1")}>キャンセル</button>
                <button
                  onClick={submitReport}
                  disabled={!reportReason}
                  className={cx(
                    "flex-1 font-black py-3 rounded-2xl text-[14px] press",
                    reportReason ? "bg-danger text-white" : "bg-sunk text-mute cursor-not-allowed"
                  )}
                >
                  通報する
                </button>
              </div>
            </Sheet>
          )}

          {/* ☕ ポイント交換＆電子チケットボトムシート */}
          {openCompose && (
            <Sheet onClose={() => setOpenCompose(false)}>
              <SheetHeader title="投稿する" icon="add_circle" onClose={() => setOpenCompose(false)} />
              <div className="px-5 pb-6 pt-1 space-y-3">
                <button onClick={() => { setOpenCompose(false); openAsk(""); }} className="w-full text-left bg-ask-tint rounded-3xl p-4 flex items-center gap-3.5 press">
                  <span className="w-12 h-12 rounded-2xl bg-ask text-on-brand flex items-center justify-center flex-shrink-0"><Icon n="help" fill size={28} /></span>
                  <span>
                    <span className="block font-head font-black text-[17px] text-ask-ink leading-tight">質問する</span>
                    <span className="block text-[12px] text-ask-ink leading-snug mt-0.5">知りたいことを、みんなに聞いてみよう。</span>
                  </span>
                </button>
                <button onClick={() => { setOpenCompose(false); openPost(); }} className="w-full text-left bg-brand-tint rounded-3xl p-4 flex items-center gap-3.5 press">
                  <span className="w-12 h-12 rounded-2xl bg-brand text-on-brand flex items-center justify-center flex-shrink-0"><Icon n="lightbulb" fill size={28} /></span>
                  <span>
                    <span className="block font-head font-black text-[17px] text-brand-deep leading-tight">情報を投稿する</span>
                    <span className="block text-[12px] text-brand-deep leading-snug mt-0.5">知っていることを教えよう。投稿で +10pt</span>
                  </span>
                </button>
              </div>
            </Sheet>
          )}

          {searchSheet === "sort" && (
            <Sheet onClose={() => setSearchSheet(null)}>
              <SheetHeader title="並べ替え" icon="swap_vert" onClose={() => setSearchSheet(null)} />
              <div className="px-5 pb-6 pt-1 space-y-1.5">
                {SORT_OPTIONS.map(o => (
                  <button
                    key={o.v}
                    onClick={() => { setSortKey(o.v); setSearchSheet(null); }}
                    aria-pressed={sortKey === o.v}
                    className={cx("w-full text-left rounded-2xl px-4 py-3.5 flex items-center gap-3 press", sortKey === o.v ? "bg-brand-tint text-brand-deep font-black" : "bg-sunk text-ink font-bold")}
                  >
                    <Icon n={o.icon} fill size={20} />
                    <span className="flex-1 text-[14px]">{o.label}</span>
                    {sortKey === o.v && <Icon n="check" size={20} />}
                  </button>
                ))}
              </div>
            </Sheet>
          )}

          {searchSheet === "filter" && (
            <Sheet onClose={() => setSearchSheet(null)}>
              <SheetHeader title="絞り込み" icon="tune" onClose={() => setSearchSheet(null)} />
              <div className="px-5 pb-3 pt-1 space-y-4 overflow-y-auto">
                {[
                  { title: "種類", items: [
                    { key: "q", label: "質問", on: onlyQuestions, toggle: () => { setOnlyInfo(false); setOnlyQuestions(!onlyQuestions); } },
                    { key: "i", label: "情報", on: onlyInfo, toggle: () => { setOnlyQuestions(false); setOnlyInfo(!onlyInfo); } }
                  ] },
                  { title: "回答", items: [
                    { key: "n", label: "回答なし", on: answerFilter === "none", toggle: () => setAnswerFilter(answerFilter === "none" ? "all" : "none") },
                    { key: "h", label: "回答あり", on: answerFilter === "has", toggle: () => setAnswerFilter(answerFilter === "has" ? "all" : "has") }
                  ] },
                  { title: "条件", items: [
                    { key: "p", label: "写真あり", on: fImage, toggle: () => setFImage(!fImage) },
                    { key: "f", label: "高評価", on: fPopular, toggle: () => setFPopular(!fPopular) },
                    { key: "r", label: "1週間以内", on: fRecent, toggle: () => setFRecent(!fRecent) }
                  ] }
                ].map(g => (
                  <div key={g.title}>
                    <p className="text-[12px] font-bold text-sub mb-1.5">{g.title}</p>
                    <div className="flex flex-wrap gap-2">
                      {g.items.map(f => (
                        <button
                          key={f.key}
                          onClick={f.toggle}
                          aria-pressed={f.on}
                          className={cx("px-4 py-2 rounded-full text-[13px] font-bold press border-[1.5px]", f.on ? "bg-brand text-on-brand border-brand" : "bg-surface text-sub border-line")}
                        >
                          {f.label}
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
              <div className="px-5 pb-6 pt-3 flex gap-2.5 border-t border-line/70">
                <button onClick={() => { resetResultFilters(); setOnlyQuestions(false); }} className={cx(BTN_SOFT, "px-5")}>リセット</button>
                <button onClick={() => setSearchSheet(null)} className={cx(BTN_PRIMARY, "flex-1")}>結果を見る（{filteredPosts.length}件）</button>
              </div>
            </Sheet>
          )}

          {openNotices && (
            <Sheet onClose={() => setOpenNotices(false)} z={60}>
              <SheetHeader
                title="お知らせ"
                icon="notifications"
                onClose={() => setOpenNotices(false)}
                right={unreadTotal > 0 && (
                  <button onClick={markAllNoticesRead} className="text-[12px] font-black text-brand-deep px-2 py-1 press">すべて既読にする</button>
                )}
              />
              <div className="px-5 pb-6 pt-2 space-y-2.5 overflow-y-auto">
                {notices.length === 0 ? (
                  <div className="text-center py-8 space-y-2">
                    <div className="w-14 h-14 rounded-3xl bg-sunk text-mute mx-auto flex items-center justify-center"><Icon n="notifications_none" size={30} /></div>
                    <p className="font-head font-black text-[15px]">まだお知らせはありません</p>
                    <p className="text-[12px] text-sub leading-relaxed">質問の「気になる」を押しておくと、新しい回答が付いたときにここでお知らせします。自分の質問への回答も届きます。</p>
                  </div>
                ) : notices.map(n => (
                  <button
                    key={n.id}
                    onClick={() => { setOpenNotices(false); setSelectedPostId(n.postId); }}
                    className={cx("w-full text-left rounded-2xl p-3.5 flex gap-3 items-start press", n.read ? "bg-sunk" : "bg-brand-tint")}
                  >
                    <span className={cx("w-9 h-9 rounded-full flex items-center justify-center flex-shrink-0", n.kind === "ai" ? "bg-sky-tint text-sky-ink" : "bg-surface text-brand-deep")}>
                      <Icon n={n.kind === "ai" ? "volunteer_activism" : "forum"} fill size={20} />
                    </span>
                    <span className="min-w-0 flex-1">
                      <span className="block text-[13px] font-black leading-snug">{n.kind === "ai" ? "AIサポーターからメッセージが届きました" : "新しい回答が届きました"}</span>
                      <span className="block text-[12px] text-sub mt-0.5 truncate">「{n.title}」</span>
                      {n.preview && <span className="block text-[12px] text-ink mt-1 line-clamp-2 leading-relaxed">{n.preview}</span>}
                      <span className="block text-[12px] text-mute mt-1">{agoLabel(n.at)}</span>
                    </span>
                    {!n.read && <span className="w-2.5 h-2.5 rounded-full bg-love flex-shrink-0 mt-1.5" aria-label="未読"></span>}
                  </button>
                ))}
                <p className="text-[12px] text-mute leading-relaxed pt-1">※ デモ版：質問の「気になる」を押すと、約6秒後に先輩の回答が届いたことにしています。本番では、実際に回答が付いたタイミングで、アプリのお知らせに加えてLINEやメールでも届ける想定です。</p>
              </div>
            </Sheet>
          )}

          {openPointExchangeModal && (
            <Sheet onClose={() => setOpenPointExchangeModal(false)}>
              <SheetHeader title="学内カフェ・生協 ポイント交換" icon="local_cafe" onClose={() => setOpenPointExchangeModal(false)} />

              <div className="mx-5 mb-3 bg-ask-tint rounded-3xl p-3.5 flex justify-between items-center">
                <span className="text-ask-ink font-bold text-[13px]">現在の保有ポイント:</span>
                <div className="font-head font-black text-ask-ink text-[20px] flex items-center gap-1">
                  <Icon n="stars" fill size={20} />
                  <span>{userThanks} pt</span>
                </div>
              </div>

              <div className="px-5 pb-3">
                <Segmented
                  value={activeTabPointModal}
                  onChange={setActiveTabPointModal}
                  options={[
                    { value: "exchange", label: "ポイントを使う", icon: "storefront" },
                    { value: "myCoupons", label: `MYチケット (${myCoupons.filter(c => !c.isUsed).length})`, icon: "confirmation_number" }
                  ]}
                />
              </div>

              <div className="px-5 pb-5 overflow-y-auto space-y-3 flex-1">
                {activeTabPointModal === "exchange" && (
                  <div className="space-y-3">
                    <p className="text-[13px] text-sub leading-relaxed">
                      投稿や感謝で貯めたサンクスptを、学内カフェや生協で使える電子チケットに交換できます。
                    </p>

                    {[
                      { tag: "学内カフェ提携", tagTone: "bg-ask-tint text-ask-ink", name: "☕ 学内カフェ ドリンク1杯無料チケット", desc: "全ドリンク対象（ブレンド・ラテ・季節のドリンク）", cost: 100, title: "学内カフェ ドリンク1杯無料チケット", unit: "チケット" },
                      { tag: "カフェ・購買共通", tagTone: "bg-brand-tint text-brand-deep", name: "🥤 学内カフェ＆生協 100円引き電子クーポン", desc: `カフェ全商品・${U.dining}のお会計で利用可能`, cost: 50, title: "学内カフェ＆生協 100円引きクーポン", unit: "クーポン" }
                    ].map(item => (
                      <div key={item.cost} className="bg-surface p-4 rounded-3xl shadow-soft border border-line/70 space-y-3">
                        <div className="flex justify-between items-start gap-2">
                          <div className="min-w-0">
                            <span className={cx("text-[12px] font-black px-2.5 py-0.5 rounded-full", item.tagTone)}>{item.tag}</span>
                            <h4 className="font-bold text-[15px] mt-1.5 leading-snug">{item.name}</h4>
                            <p className="text-[12px] text-sub mt-0.5">{item.desc}</p>
                          </div>
                          <span className="font-head font-black text-ask-ink text-[14px] bg-ask-tint px-3 py-1 rounded-full flex-shrink-0">{item.cost} pt</span>
                        </div>
                        <button
                          onClick={() => handleExchangePoint({ title: item.title, cost: item.cost })}
                          disabled={userThanks < item.cost}
                          className={cx(
                            "w-full py-3 rounded-2xl font-black text-[14px] press",
                            userThanks >= item.cost ? "bg-ask text-on-brand shadow-soft" : "bg-sunk text-mute cursor-not-allowed"
                          )}
                        >
                          {userThanks >= item.cost ? `${item.cost}ptで${item.unit}に交換する` : "ポイントが不足しています"}
                        </button>
                      </div>
                    ))}
                  </div>
                )}

                {activeTabPointModal === "myCoupons" && (
                  <div className="space-y-3">
                    <p className="text-[13px] text-sub leading-relaxed">
                      交換済みのチケットです。カフェのレジで「利用する」を押して画面を提示してください。
                    </p>

                    {myCoupons.length === 0 ? (
                      <div className="py-8 text-center text-mute text-[13px]">
                        所持しているチケットはありません。「ポイントを使う」から交換できます。
                      </div>
                    ) : (
                      myCoupons.map(coupon => (
                        <div
                          key={coupon.id}
                          className={cx(
                            "p-4 rounded-3xl",
                            coupon.isUsed ? "bg-sunk opacity-60" : "bg-ask-tint border-2 border-dashed border-ask"
                          )}
                        >
                          <div className="flex justify-between items-center text-[12px] mb-1">
                            <span className="text-ask-ink font-mono font-bold">{coupon.code}</span>
                            <span className="text-sub">{coupon.date} 交換</span>
                          </div>
                          <h4 className="font-bold text-[15px] mb-3">{coupon.title}</h4>

                          {coupon.isUsed ? (
                            <span className="block text-center py-2.5 bg-surface text-mute font-bold text-[13px] rounded-2xl">使用済み</span>
                          ) : (
                            <button
                              onClick={() => setActiveCouponForUse(coupon)}
                              className={cx(BTN_PRIMARY, "w-full flex items-center justify-center gap-1.5")}
                            >
                              <Icon n="qr_code_2" size={20} />
                              <span>レジで提示して使う</span>
                            </button>
                          )}
                        </div>
                      ))
                    )}
                  </div>
                )}
              </div>
            </Sheet>
          )}

          {/* 🏷️ カフェレジ提示用バーコードモーダル */}
          {activeCouponForUse && (
            <Dialog onClose={() => setActiveCouponForUse(null)} className="max-w-xs">
              <div className="p-5 space-y-4 text-center">
                <div className="flex justify-between items-center">
                  <span className="text-[12px] font-black bg-ask text-on-brand px-3 py-1 rounded-full">学内カフェ提示用</span>
                  <button onClick={() => setActiveCouponForUse(null)} aria-label="閉じる" className="w-9 h-9 rounded-full bg-sunk text-sub flex items-center justify-center press">
                    <Icon n="close" size={20} />
                  </button>
                </div>

                <div className="space-y-1">
                  <h3 className="font-head font-black text-[17px]">{activeCouponForUse.title}</h3>
                  <p className="text-[12px] text-sub">レジのスタッフにこちらの画面をお見せください</p>
                </div>

                <div className="bg-white p-4 rounded-3xl shadow-soft space-y-2" style={{ color: "#111" }}>
                  <div className="h-14 rounded-md p-2 flex items-center justify-between gap-1 overflow-hidden" style={{ background: "#111" }}>
                    {Array.from({ length: 28 }).map((_, i) => (
                      <div
                        key={i}
                        className={`h-full bg-white ${i % 3 === 0 ? 'w-1.5' : i % 2 === 0 ? 'w-0.5' : 'w-1'}`}
                      ></div>
                    ))}
                  </div>
                  <span className="font-mono font-black text-[13px] tracking-widest block">{activeCouponForUse.code}</span>
                </div>

                <div className="space-y-2">
                  <button
                    onClick={() => handleUseCoupon(activeCouponForUse.id)}
                    className={cx(BTN_PRIMARY, "w-full")}
                  >
                    スタッフが確認して使用済みにする
                  </button>
                  <p className="text-[12px] text-mute">※ご自分で誤って押さないようご注意ください</p>
                </div>
              </div>
            </Dialog>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

  <!-- 📱 Service Worker 登録スクリプト (PWA化対応) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then((reg) => console.log('Service Worker 登録成功:', reg.scope))
          .catch((err) => console.log('Service Worker 登録失敗:', err));
      });
    }
  </script>
</body>
</html>
